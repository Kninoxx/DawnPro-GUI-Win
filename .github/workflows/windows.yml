name: Windows build

on:
  push:
    paths:
      - 'windows/**'
      - '.github/workflows/windows.yml'
  pull_request:
    paths:
      - 'windows/**'
      - '.github/workflows/windows.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Restore
        run: dotnet restore windows/DawnPro.slnx --locked-mode
      - name: Build
        run: dotnet build windows/DawnPro.slnx -c Release --no-restore
      - name: Run software tests
        run: dotnet test windows/DawnPro.Tests -c Release --no-build
      - name: Verify portable Windows x64 publish
        run: >
          dotnet publish windows/DawnPro.Windows -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true -p:DebugType=embedded
