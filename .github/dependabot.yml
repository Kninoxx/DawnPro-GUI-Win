version: 2
updates:
  # .NET test dependencies
  - package-ecosystem: "nuget"
    directory: "/windows/DawnPro.Tests"
    schedule:
      interval: "daily"
    open-pull-requests-limit: 10
    commit-message:
      prefix: "deps"
      include: "scope"

  # GitHub Actions updates
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
